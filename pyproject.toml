[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vertmaxxer"
dynamic = ["version"]
authors = [
  { name="Mike Grudić", email="mike.grudic@gmail.com" },
]
description = "Find the trail route with the most (or least) climbing from a starting point"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
"numpy", "scipy", "networkx", "requests", "pillow", "ortools"
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[project.scripts]
vertmaxxer = "vertmaxxer.cli:main"
vertmaxxer-spurify = "vertmaxxer.cli:spurify_main"

[project.urls]
Homepage = "https://github.com/mikegrudic/vertmaxxer"
Issues = "https://github.com/mikegrudic/vertmaxxer/issues"

[tool.setuptools.dynamic]
version = {attr = "vertmaxxer.__version__"}

[tool.setuptools.package-data]
vertmaxxer = ["data/*.dat", "data/closures/*.json", "data/links/*.json"]
